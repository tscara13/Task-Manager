<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json"><title>TaskFlow v2</title><style>
:root{--bg:#f1f5f9;--panel:#fff;--text:#0f172a;--muted:#64748b;--line:#dbe3ee;--accent:#2563eb;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}header{background:#0f172a;color:#fff;padding:14px max(14px,calc((100% - 1500px)/2));display:flex;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10}.wrap{max-width:1500px;margin:auto;padding:14px}.tabs,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:12px}.btn,.tabs button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;font-weight:650;cursor:pointer}.primary,.tabs button.active{background:var(--accent)!important;color:#fff;border-color:var(--accent)!important}.danger{color:var(--danger)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}.filterbox{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:12px}.filterbox h3{font-size:13px;margin:0 0 8px}.filters input,.filters select,dialog input,dialog textarea{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;min-width:145px}.filters label{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--muted);gap:3px}.tablewrap,.gantt{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}.tag{display:inline-flex;background:#e2e8f0;border-radius:999px;padding:3px 8px;margin:1px;font-size:11px}.p1{background:#fee2e2;color:#991b1b}.p2{background:#ffedd5;color:#9a3412}.p3{background:#dbeafe;color:#1e40af}.p4{background:#e2e8f0;color:#334155}.empty{text-align:center;color:var(--muted);padding:35px}.hidden{display:none!important}dialog{border:0;border-radius:15px;width:min(760px,calc(100% - 20px));box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0f172a99}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:var(--muted)}.tagEditor{border:1px solid var(--line);border-radius:9px;padding:6px;display:flex;flex-wrap:wrap;gap:5px;min-height:42px}.tagEditor input{border:0;outline:0;padding:4px;min-width:130px;flex:1}.chip{display:inline-flex;align-items:center;gap:5px;background:#dbeafe;color:#1e3a8a;border-radius:999px;padding:4px 8px;font-size:12px}.chip button{border:0;background:transparent;color:inherit;cursor:pointer;padding:0}.hint{font-size:11px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.grow{display:grid;grid-template-columns:210px repeat(var(--days),minmax(28px,1fr))}.gname,.gday{padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px}.gname{position:sticky;left:0;background:#fff;z-index:2}.gtrack{grid-column:2/-1;display:grid;grid-template-columns:repeat(var(--days),1fr);min-height:36px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to right,transparent 0,transparent calc((100% / var(--days)) - 1px),var(--line) calc((100% / var(--days)) - 1px),var(--line) calc(100% / var(--days)))}.bar{align-self:center;height:23px;border-radius:6px;background:#2563eb;color:white;padding:3px 6px;font-size:11px;overflow:hidden;white-space:nowrap}.projectTitle{background:#e2e8f0;font-weight:800;padding:7px}.ggrid{min-width:900px}small{color:var(--muted)}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:8px}header{align-items:flex-start}th:nth-child(5),td:nth-child(5),th:nth-child(7),td:nth-child(7){display:none}}
</style></head><body><header><div><b>TaskFlow v2</b><br><small style="color:#cbd5e1">Filtri completi e tag riutilizzabili</small></div><button class="btn primary" id="newBtn">+ Nuovo task</button></header><main class="wrap"><div class="tabs"><button class="active" data-tab="tasks">Task</button><button data-tab="gantt">Gantt</button></div>
<section id="tasks" class="panel"><div class="filterbox"><h3>Filtri task</h3><div class="filters"><label>Cerca<input id="fSearch" placeholder="Titolo o note"></label><label>Progetto<select id="fProject"></select></label><label>Status<select id="fStatus"></select></label><label>Tipo<select id="fType"></select></label><label>Container<select id="fContainer"></select></label><label>Priorità<select id="fPriority"></select></label><label>Component<select id="fComponent"></select></label><label>Inizio da<input id="fStart" type="date"></label><label>Fine entro<input id="fEnd" type="date"></label><button class="btn" id="clearFilters" style="align-self:end">Azzera</button></div></div><div class="actions"><button class="btn" id="exportBtn">Esporta JSON</button><label class="btn">Importa JSON<input id="importFile" type="file" accept="application/json" hidden></label><small id="count" style="align-self:center"></small></div><div class="tablewrap"><table><thead><tr><th>Task</th><th>Progetto</th><th>Status</th><th>Tipo</th><th>Container</th><th>Priorità</th><th>Component</th><th>Periodo</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="gantt" class="panel hidden"><div class="filters"><label>Progetto<select id="gProject"></select></label><label>Status<select id="gStatus"></select></label></div><div id="ganttBody" class="gantt"></div></section></main>
<dialog id="dlg"><form id="form"><h2 id="formTitle">Nuovo task</h2><input type="hidden" id="id"><div class="formgrid"><div class="field full"><label>Titolo *</label><input id="title" required></div><div class="field"><label>Progetto *</label><input id="project" list="list-project" required><datalist id="list-project"></datalist><span class="hint">Scrivi un nuovo progetto o scegline uno esistente.</span></div><div class="field"><label>Inizio *</label><input id="start" type="date" required></div><div class="field"><label>Fine *</label><input id="end" type="date" required></div><div class="field full"><label>Status</label><div class="tagEditor" data-field="status"></div></div><div class="field full"><label>Tipo</label><div class="tagEditor" data-field="type"></div></div><div class="field full"><label>Container</label><div class="tagEditor" data-field="container"></div></div><div class="field full"><label>Priorità</label><div class="tagEditor" data-field="priority"></div></div><div class="field full"><label>Component</label><div class="tagEditor" data-field="component"></div></div><div class="field full"><span class="hint">Digita un valore e premi Invio o virgola. Ogni valore diventa un tag riutilizzabile negli altri task.</span></div><div class="field full"><label>Note</label><textarea id="notes" rows="3"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Annulla</button><button class="btn primary">Salva</button></div></form></dialog>
<script>
const KEY='taskflow-v1',FIELDS=['status','type','container','priority','component'];let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function arr(v){return Array.isArray(v)?v.filter(Boolean):(v?[v]:[])}tasks=tasks.map(t=>({...t,...Object.fromEntries(FIELDS.map(f=>[f,arr(t[f])]))}));
let editTags=Object.fromEntries(FIELDS.map(f=>[f,[]]));function vals(f){return [...new Set(tasks.flatMap(t=>f==='project'?[t.project]:arr(t[f])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'))}
function tagHtml(a,f=''){return arr(a).map(x=>`<span class="tag ${f==='priority'?x.toLowerCase():''}">${esc(x)}</span>`).join('')||'<small>—</small>'}
function fillSelect(id,label,values){let el=$('#'+id),old=el.value;el.innerHTML=`<option value="">${label}</option>`+values.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');el.value=values.includes(old)?old:''}
function refreshLists(){fillSelect('fProject','Tutti i progetti',vals('project'));fillSelect('gProject','Tutti i progetti',vals('project'));FIELDS.forEach(f=>fillSelect('f'+f[0].toUpperCase()+f.slice(1),'Tutti',vals(f)));fillSelect('gStatus','Tutti gli status',vals('status'));$('#list-project').innerHTML=vals('project').map(x=>`<option value="${esc(x)}">`).join('')}
function filtered(){let q=$('#fSearch').value.toLowerCase(),a=tasks.filter(t=>(!q||(`${t.title} ${t.notes}`).toLowerCase().includes(q))) ;for(let f of ['project',...FIELDS]){let v=$('#f'+f[0].toUpperCase()+f.slice(1)).value;a=a.filter(t=>!v||(f==='project'?t[f]===v:arr(t[f]).includes(v)))}let s=$('#fStart').value,e=$('#fEnd').value;return a.filter(t=>(!s||t.end>=s)&&(!e||t.start<=e)).sort((x,y)=>x.start.localeCompare(y.start))}
function renderTasks(){let a=filtered();$('#count').textContent=`${a.length} di ${tasks.length} task`;$('#rows').innerHTML=a.length?a.map(t=>`<tr><td><b>${esc(t.title)}</b>${t.notes?`<br><small>${esc(t.notes)}</small>`:''}</td><td>${esc(t.project)}</td><td>${tagHtml(t.status)}</td><td>${tagHtml(t.type)}</td><td>${tagHtml(t.container)}</td><td>${tagHtml(t.priority,'priority')}</td><td>${tagHtml(t.component)}</td><td>${fmt(t.start)}<br>${fmt(t.end)}</td><td><button class="btn edit" data-id="${t.id}">Modifica</button> <button class="btn danger del" data-id="${t.id}">×</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">Nessun task corrisponde ai filtri.</td></tr>'}
function dt(s){return new Date(s+'T12:00:00')}function fmt(s){return s?dt(s).toLocaleDateString('it-IT'):''}
function renderEditor(f){let box=$(`.tagEditor[data-field="${f}"]`);box.innerHTML=editTags[f].map((x,i)=>`<span class="chip">${esc(x)}<button type="button" data-i="${i}" aria-label="Rimuovi">×</button></span>`).join('')+`<input list="list-${f}" placeholder="Aggiungi tag..."><datalist id="list-${f}">${vals(f).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;let inp=box.querySelector('input');inp.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(f,inp.value)}};inp.onblur=()=>addTag(f,inp.value);box.onclick=e=>{let b=e.target.closest('button');if(b){editTags[f].splice(+b.dataset.i,1);renderEditor(f)}}}
function addTag(f,v){v=v.trim().replace(/,$/,'');if(v&&!editTags[f].some(x=>x.toLowerCase()===v.toLowerCase()))editTags[f].push(v);renderEditor(f)}
function openForm(t={}){$('#id').value=t.id||'';$('#formTitle').textContent=t.id?'Modifica task':'Nuovo task';['title','project','start','end','notes'].forEach(f=>$('#'+f).value=t[f]||'');editTags=Object.fromEntries(FIELDS.map(f=>[f,arr(t[f])]));FIELDS.forEach(renderEditor);$('#dlg').showModal()}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
$('#form').onsubmit=e=>{e.preventDefault();document.activeElement?.blur();let o={id:$('#id').value||crypto.randomUUID(),title:$('#title').value.trim(),project:$('#project').value.trim(),start:$('#start').value,end:$('#end').value,notes:$('#notes').value.trim(),...Object.fromEntries(FIELDS.map(f=>[f,[...editTags[f]]]))};if(o.end<o.start)return alert('La fine deve essere uguale o successiva all’inizio.');let i=tasks.findIndex(t=>t.id===o.id);i<0?tasks.push(o):tasks[i]=o;$('#dlg').close();save()}
function renderGantt(){let p=$('#gProject').value,s=$('#gStatus').value,a=tasks.filter(t=>(!p||t.project===p)&&(!s||arr(t.status).includes(s))).sort((x,y)=>x.project.localeCompare(y.project)||x.start.localeCompare(y.start));if(!a.length){$('#ganttBody').innerHTML='<div class="empty">Nessun task da mostrare.</div>';return}let min=dt(a.reduce((m,t)=>t.start<m?t.start:m,a[0].start)),max=dt(a.reduce((m,t)=>t.end>m?t.end:m,a[0].end)),days=Math.min(180,Math.max(1,Math.round((max-min)/86400000)+1));let labs=Array.from({length:days},(_,i)=>{let d=new Date(min.getTime()+i*86400000);return `<div class="gday">${d.getDate()}<br>${d.toLocaleDateString('it-IT',{month:'short'}).slice(0,3)}</div>`}).join(''),h=`<div class="ggrid" style="--days:${days}"><div class="grow"><div class="gname"><b>Task</b></div>${labs}</div>`,last='';for(let t of a){if(t.project!==last){h+=`<div class="projectTitle">${esc(t.project)}</div>`;last=t.project}let st=Math.max(1,Math.round((dt(t.start)-min)/86400000)+1),en=Math.min(days,Math.round((dt(t.end)-min)/86400000)+1);h+=`<div class="grow"><div class="gname"><b>${esc(t.title)}</b><br>${tagHtml(t.status)}</div><div class="gtrack"><div class="bar" style="grid-column:${st}/${en+1}">${esc(t.title)}</div></div></div>`}$('#ganttBody').innerHTML=h+'</div>'}
function render(){refreshLists();renderTasks();renderGantt()}$('#newBtn').onclick=()=>openForm();$('#cancel').onclick=()=>$('#dlg').close();$('#rows').onclick=e=>{let b=e.target.closest('button');if(!b)return;let t=tasks.find(x=>x.id===b.dataset.id);if(b.classList.contains('edit'))openForm(t);if(b.classList.contains('del')&&confirm('Eliminare il task?')){tasks=tasks.filter(x=>x.id!==b.dataset.id);save()}};
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('active',x===b));['tasks','gantt'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab));renderGantt()});$$('.filterbox input,.filterbox select').forEach(x=>x.oninput=renderTasks);$('#clearFilters').onclick=()=>{$$('.filterbox input,.filterbox select').forEach(x=>x.value='');renderTasks()};['gProject','gStatus'].forEach(x=>$('#'+x).onchange=renderGantt);
$('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.download='taskflow-v2-backup.json';a.click();URL.revokeObjectURL(a.href)};$('#importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x))throw 0;tasks=x.map(t=>({...t,...Object.fromEntries(FIELDS.map(f=>[f,arr(t[f])]))}));save()}catch{alert('JSON non valido')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
