<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json"><title>TaskFlow</title>
<style>
:root{--bg:#f1f5f9;--panel:#fff;--text:#0f172a;--muted:#64748b;--line:#dbe3ee;--accent:#2563eb;--danger:#dc2626;--ok:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}header{background:#0f172a;color:white;padding:14px max(16px,calc((100% - 1400px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0}.wrap{max-width:1400px;margin:auto;padding:16px}.tabs,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:14px}.tabs button,.btn{border:1px solid var(--line);background:var(--panel);padding:10px 13px;border-radius:10px;font-weight:650;cursor:pointer}.tabs button.active,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--danger)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 3px 16px #0f172a0c}.filters{margin-bottom:12px}.filters input,.filters select,dialog input,dialog select,dialog textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--text);min-width:150px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase}.tablewrap{overflow:auto}.badge{display:inline-block;border-radius:999px;background:#e2e8f0;padding:3px 8px;font-size:12px}.p1{background:#fee2e2;color:#991b1b}.p2{background:#ffedd5;color:#9a3412}.p3{background:#dbeafe;color:#1e40af}.p4{background:#e2e8f0;color:#334155}.empty{text-align:center;color:var(--muted);padding:40px}.hidden{display:none!important}dialog{border:0;border-radius:16px;box-shadow:0 20px 70px #0004;max-width:720px;width:calc(100% - 24px)}dialog::backdrop{background:#0f172a99}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.gantt{overflow:auto}.ggrid{min-width:900px}.grow{display:grid;grid-template-columns:210px repeat(var(--days),minmax(28px,1fr));align-items:stretch}.gname,.gday{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;font-size:12px}.gname{position:sticky;left:0;background:var(--panel);z-index:2}.gday{text-align:center;color:var(--muted)}.gtrack{grid-column:2/-1;display:grid;grid-template-columns:repeat(var(--days),1fr);border-bottom:1px solid var(--line);min-height:38px;position:relative;background:repeating-linear-gradient(to right,transparent 0,transparent calc((100% / var(--days)) - 1px),var(--line) calc((100% / var(--days)) - 1px),var(--line) calc(100% / var(--days)))}.bar{align-self:center;height:24px;border-radius:7px;background:#2563eb;color:white;padding:4px 7px;font-size:11px;overflow:hidden;white-space:nowrap;z-index:1}.project-title{background:#e2e8f0;font-weight:800;padding:8px;border-bottom:1px solid var(--line)}small{color:var(--muted)}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}header{align-items:flex-start}.wrap{padding:10px}}
</style></head><body>
<header><div><h1>TaskFlow</h1><small style="color:#cbd5e1">Task e Gantt per progetto</small></div><button class="btn primary" id="newBtn">+ Nuovo task</button></header>
<main class="wrap"><div class="tabs"><button class="active" data-tab="tasks">Task</button><button data-tab="gantt">Gantt</button></div>
<section id="tasks" class="panel"><div class="filters"><input id="search" placeholder="Cerca task..."><select id="projectFilter"><option value="">Tutti i progetti</option></select><select id="statusFilter"><option value="">Tutti gli status</option></select><button class="btn" id="exportBtn">Esporta JSON</button><label class="btn">Importa JSON<input id="importFile" type="file" accept="application/json" hidden></label></div><div class="tablewrap"><table><thead><tr><th>Task</th><th>Progetto</th><th>Status</th><th>Tipo</th><th>Container</th><th>Priorità</th><th>Component</th><th>Periodo</th><th></th></tr></thead><tbody id="taskRows"></tbody></table></div></section>
<section id="gantt" class="panel hidden"><div class="filters"><select id="ganttProject"><option value="">Tutti i progetti</option></select><button class="btn" id="todayBtn">Periodo dei task</button></div><div id="ganttBody" class="gantt"></div></section></main>
<dialog id="taskDialog"><form id="taskForm"><h2 id="formTitle">Nuovo task</h2><input type="hidden" id="taskId"><div class="formgrid">
<div class="field full"><label>Titolo *</label><input id="title" required maxlength="120"></div><div class="field"><label>Progetto *</label><input id="project" required list="projects"></div><div class="field"><label>Status</label><select id="status"><option>Da fare</option><option>In corso</option><option>Bloccato</option><option>Completato</option></select></div>
<div class="field"><label>Tipo</label><input id="type" placeholder="Attività, milestone..."></div><div class="field"><label>Container</label><input id="container" placeholder="Workstream / area"></div><div class="field"><label>Priorità</label><select id="priority"><option>P1</option><option>P2</option><option selected>P3</option><option>P4</option></select></div><div class="field"><label>Component</label><input id="component" placeholder="Sistema / componente"></div><div class="field"><label>Inizio *</label><input id="start" type="date" required></div><div class="field"><label>Fine *</label><input id="end" type="date" required></div><div class="field full"><label>Note</label><textarea id="notes" rows="3"></textarea></div></div><datalist id="projects"></datalist><div class="modal-actions"><button type="button" class="btn" id="cancelBtn">Annulla</button><button class="btn primary">Salva</button></div></form></dialog>
<script>
const KEY='taskflow-v1'; let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(tasks)); render()}
function date(s){return new Date(s+'T12:00:00')} function fmt(s){return date(s).toLocaleDateString('it-IT')}
function lists(){let ps=[...new Set(tasks.map(x=>x.project).filter(Boolean))].sort(), ss=[...new Set(tasks.map(x=>x.status).filter(Boolean))].sort(); ['projectFilter','ganttProject'].forEach(id=>{let old=$('#'+id).value; $('#'+id).innerHTML='<option value="">Tutti i progetti</option>'+ps.map(p=>`<option>${esc(p)}</option>`).join(''); $('#'+id).value=old}); $('#statusFilter').innerHTML='<option value="">Tutti gli status</option>'+ss.map(s=>`<option>${esc(s)}</option>`).join(''); $('#projects').innerHTML=ps.map(p=>`<option value="${esc(p)}">`).join('')}
function renderTasks(){let q=$('#search').value.toLowerCase(),p=$('#projectFilter').value,s=$('#statusFilter').value; let a=tasks.filter(t=>(!q||JSON.stringify(t).toLowerCase().includes(q))&&(!p||t.project===p)&&(!s||t.status===s)).sort((a,b)=>a.start.localeCompare(b.start)); $('#taskRows').innerHTML=a.length?a.map(t=>`<tr><td><strong>${esc(t.title)}</strong>${t.notes?`<br><small>${esc(t.notes)}</small>`:''}</td><td>${esc(t.project)}</td><td><span class="badge">${esc(t.status)}</span></td><td>${esc(t.type)}</td><td>${esc(t.container)}</td><td><span class="badge ${t.priority.toLowerCase()}">${esc(t.priority)}</span></td><td>${esc(t.component)}</td><td>${fmt(t.start)}<br>${fmt(t.end)}</td><td><button class="btn edit" data-id="${t.id}">Modifica</button> <button class="btn danger del" data-id="${t.id}">×</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">Nessun task. Creane uno per iniziare.</td></tr>'}
function renderGantt(){let p=$('#ganttProject').value,a=tasks.filter(t=>!p||t.project===p).sort((x,y)=>x.project.localeCompare(y.project)||x.start.localeCompare(y.start)); if(!a.length){$('#ganttBody').innerHTML='<div class="empty">Nessun task da mostrare.</div>';return} let min=date(a.reduce((m,t)=>t.start<m?t.start:m,a[0].start)), max=date(a.reduce((m,t)=>t.end>m?t.end:m,a[0].end)); let days=Math.min(180,Math.max(1,Math.round((max-min)/86400000)+1)); max=new Date(min.getTime()+(days-1)*86400000); let labels=Array.from({length:days},(_,i)=>{let d=new Date(min.getTime()+i*86400000);return `<div class="gday">${d.getDate()}<br>${d.toLocaleDateString('it-IT',{month:'short'}).slice(0,3)}</div>`}).join(''); let html=`<div class="ggrid" style="--days:${days}"><div class="grow"><div class="gname"><b>Task</b></div>${labels}</div>`; let last=''; for(let t of a){if(t.project!==last){html+=`<div class="project-title">${esc(t.project)}</div>`;last=t.project}let st=Math.max(1,Math.round((date(t.start)-min)/86400000)+1), en=Math.min(days,Math.round((date(t.end)-min)/86400000)+1);html+=`<div class="grow"><div class="gname"><b>${esc(t.title)}</b><br><small>${esc(t.status)} · ${esc(t.priority)}</small></div><div class="gtrack"><div class="bar" style="grid-column:${st}/${en+1}" title="${esc(t.title)}: ${fmt(t.start)} - ${fmt(t.end)}">${esc(t.title)}</div></div></div>`} $('#ganttBody').innerHTML=html+'</div>'}
function render(){lists();renderTasks();renderGantt()}
function openForm(t={}){$('#taskId').value=t.id||''; $('#formTitle').textContent=t.id?'Modifica task':'Nuovo task'; ['title','project','status','type','container','priority','component','start','end','notes'].forEach(k=>$('#'+k).value=t[k]||({status:'Da fare',priority:'P3'}[k]||'')); $('#taskDialog').showModal()}
$('#taskForm').addEventListener('submit',e=>{e.preventDefault();let o={id:$('#taskId').value||crypto.randomUUID()}; ['title','project','status','type','container','priority','component','start','end','notes'].forEach(k=>o[k]=$('#'+k).value.trim()); if(o.end<o.start){alert('La data di fine deve essere successiva o uguale alla data di inizio.');return}let i=tasks.findIndex(x=>x.id===o.id);i>=0?tasks[i]=o:tasks.push(o);$('#taskDialog').close();save()});
$('#newBtn').onclick=()=>openForm(); $('#cancelBtn').onclick=()=>$('#taskDialog').close();
$('#taskRows').onclick=e=>{let b=e.target.closest('button');if(!b)return;let t=tasks.find(x=>x.id===b.dataset.id);if(b.classList.contains('edit'))openForm(t);if(b.classList.contains('del')&&confirm('Eliminare questo task?')){tasks=tasks.filter(x=>x.id!==b.dataset.id);save()}};
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('active',x===b)); ['tasks','gantt'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab));renderGantt()});
['search','projectFilter','statusFilter'].forEach(id=>$('#'+id).addEventListener('input',renderTasks)); $('#ganttProject').onchange=renderGantt;
$('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.download='taskflow-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('#importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x))throw 0;tasks=x;save()}catch{alert('File JSON non valido.')}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
